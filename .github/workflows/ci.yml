name: CI

# jamescscott.net: every check from AGENTS.md's definition of done.
# Node comes from .nvmrc and pnpm from package.json's packageManager field,
# so this, deploy.yml, and local installs all use the same versions.

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Lint, build, images, links & accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run format:check

      - name: Check images (no GPS data, nothing oversized)
        run: pnpm check:images

      - run: pnpm run build

      - name: Check internal links
        run: pnpm check:links

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check accessibility (axe, light and dark, desktop and phone)
        run: pnpm check:a11y
