name: CI

# jamescscott.net: every check from AGENTS.md's definition of done.
# Node comes from .nvmrc and pnpm from package.json's packageManager field,
# so this, deploy.yml, and local installs all use the same versions.

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Lint, build, images, links & accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run format:check

      - name: Check images (no GPS data, nothing oversized)
        run: pnpm check:images

      - run: pnpm run build

      - name: Check internal links
        run: pnpm check:links

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check accessibility (axe, light and dark, desktop and phone)
        run: pnpm check:a11y
